name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax (all runtime modules)
        run: python -m compileall -q app.py setup_wizard.py catalog_discovery.py dashboard_groups.py history.py preflight.py monitoring_areas.py model_watch.py regions.py tests
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
