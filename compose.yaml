# Local-only dashboard and persistent monitoring data.
# Copy .env.example to .env and config.example.json to config.json first.
services:
  watcher:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WATCHER_CONFIG: /app/config.json
      STATE_FILE: /data/state.json
      HISTORY_FILE: /data/history.json
      WATCHER_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.json:/app/config.json:ro
      - watcher-data:/data

volumes:
  watcher-data:
